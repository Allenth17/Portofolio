<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiflul Ma'ani – Mobile Development Enthusiast</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Sora:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <link type="text/css" rel="stylesheet" href="styles.css">

    <script type="text/javascript">
        // Global helper for opening a PDF in a fullscreen overlay (iframe)
        window.openPdfViewer = function(pdfUrl) {
            // Create the overlay container
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100vw';
            overlay.style.height = '100vh';
            overlay.style.backgroundColor = 'rgba(15, 23, 42, 0.9)'; // Dark slate overlay
            overlay.style.zIndex = '999999';
            overlay.style.display = 'flex';
            overlay.style.flexDirection = 'column';
            overlay.style.alignItems = 'center';
            overlay.style.justifyContent = 'center';

            // Create a close button
            const closeBtn = document.createElement('button');
            closeBtn.innerText = 'Close Preview';
            closeBtn.style.position = 'absolute';
            closeBtn.style.top = '20px';
            closeBtn.style.right = '20px';
            closeBtn.style.padding = '10px 20px';
            closeBtn.style.backgroundColor = '#E81CFF'; // AccentPurple
            closeBtn.style.color = '#FFFFFF';
            closeBtn.style.border = 'none';
            closeBtn.style.borderRadius = '8px';
            closeBtn.style.cursor = 'pointer';
            closeBtn.style.fontWeight = 'bold';
            closeBtn.style.zIndex = '1000000';
            closeBtn.style.boxShadow = '0 4px 12px rgba(232, 28, 255, 0.4)';

            closeBtn.onclick = function() {
                document.body.removeChild(overlay);
            };

            // Create the iframe
            const iframe = document.createElement('iframe');
            iframe.src = pdfUrl;
            iframe.style.width = '80%';
            iframe.style.height = '85%';
            iframe.style.border = '2px solid rgba(255, 255, 255, 0.1)';
            iframe.style.borderRadius = '12px';
            iframe.style.boxShadow = '0 20px 40px rgba(0,0,0,0.5)';
            // Allow fullscreen
            iframe.setAttribute('allowfullscreen', 'true');

            // Responsive adjustments for mobile
            if (window.innerWidth < 768) {
                iframe.style.width = '95%';
                iframe.style.height = '90%';
                closeBtn.style.top = '10px';
                closeBtn.style.right = '10px';
                closeBtn.style.padding = '8px 16px';
            }

            // Append elements
            overlay.appendChild(closeBtn);
            overlay.appendChild(iframe);
            document.body.appendChild(overlay);
        };

        // Global helper for downloading files directly without leaving the page
        window.downloadFile = function(fileUrl, fileName) {
            const anchor = document.createElement('a');
            anchor.href = fileUrl;
            anchor.download = fileName || 'download';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        };
    </script>
</head>

<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none" />
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                repeatCount="indefinite" />
        </circle>
    </svg>
    <script type="application/javascript" src="composeApp.js"></script>
</body>

</html>
